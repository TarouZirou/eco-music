[package]
name = "eco-music"
version = "0.2.1"
edition = "2024"
description = "YouTube Musicの公開・限定公開再生リストを聴く音声専用プレーヤー（egui UI・mpv IPC）"
license = "GPL-3.0-or-later"
repository = "https://github.com/TarouZirou/eco-music"
keywords = ["music", "youtube", "mpv", "audio"]
categories = ["multimedia::audio"]

[dependencies]
eframe = "0.36.1"
egui = "0.36.1"
libc = "0.2.189"
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"

[profile.release]
lto = "thin"
strip = true
